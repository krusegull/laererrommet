# Fly.io-konfigurasjon for Lærerrommet.
# Se DEPLOY.md for stegene du selv må kjøre (fly auth login, fly apps create,
# fly volumes create, fly deploy).
#
# "app" må være globalt unikt på Fly.io. Endre navnet under hvis det er opptatt.
app = "laererrommet"
primary_region = "arn" # Stockholm — endre til nærmeste region ved behov

[build]

[env]
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/prod.db"
  UPLOAD_DIR = "/data/uploads"

[[mounts]]
  source = "laererrommet_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
